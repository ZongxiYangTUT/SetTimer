name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-release.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements-release.txt
          .venv\Scripts\python -m pip install -e .
      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup -e -s winget `
            --silent --accept-package-agreements --accept-source-agreements
      - name: Build and verify release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\scripts\build-release.ps1 -Version $version
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SetTimer-${{ github.ref_name }}-windows-x64
          path: release/*
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/${{ github.ref_name }}.md"
          $tag = "${{ github.ref_name }}"
          if (gh release view $tag 2>$null) {
            gh release upload $tag release/* --clobber
          }
          elseif (Test-Path -LiteralPath $notes) {
            gh release create $tag release/* `
              --verify-tag --title "SetTimer $tag" --notes-file $notes
          }
          else {
            gh release create $tag release/* `
              --verify-tag --title "SetTimer $tag" --generate-notes
          }
